name: hewn-video-studio
label: Video Studio
kind: standalone
version: "0.2.0"
manifest_version: 2
api_version: 1
author: Hewn
license: MIT
description: >
  Two rooms, one file format. **Films** builds a video from HyperFrames shot
  compositions: storyboard cards per shot, edit a shot's HTML in the tab, re-render one
  shot (31 s for a 7 s shot) or the whole film, with live render progress and the quality
  gate (hook, motion, legibility) in the panel — a film only ships when all three pass.
  **Cutting room** is a source clip plus a list of edits: snip, tighten pauses, retime,
  mute, caption, undo — never a re-encoded pile of files, so undo is free and a re-cut
  costs seconds. The agent calls the same operations you click. Local rendering, no
  upload, no account, and no invented numbers: every duration, check and job state comes
  back from the API.
requires_hermes: ">=0.23.0"
tags: [video, editing, media]
provides_tools:
  - video_studio
provides_hooks: []
dashboard: dashboard
config_schema:
  max_seconds:
    type: float
    default: 90.0
    label: Duration cap
    description: Hard ceiling for a rendered cut, in seconds. The gate fails a cut longer than this.
  ffmpeg:
    type: string
    default: ffmpeg
    label: ffmpeg binary
    description: Path or name of the ffmpeg executable to use.
