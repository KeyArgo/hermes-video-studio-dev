name: hewn-video-studio
label: Video Studio
kind: standalone
version: "1.0.0"
manifest_version: 2
api_version: 1
author: InovinLabs
license: MIT
description: >
  Short product films, made with your agent on your own machine. Seven rooms in one
  studio: **Films** (player, shots, the quality gate), **Assets** (intake, proxies,
  stills as moving clips), **Script** (an idea becomes timed beats), **Timeline**
  (multi-track cut with exact undo), **Generate** (MiniMax H3 on ComfyUI for beats a
  camera could not shoot), **Music** (a real track from Music Studio as the bed) and
  **Production** (the checklist, and desktop recording).
  The parts that make it a tool rather than a prompt box: shots are rendered from typed
  HyperFrames compositions under a written contract, real footage is captured from the
  product itself, shot lengths snap to the song's beat grid, and every finished file is
  **measured** — hook, motion per second, loudness, legibility, and the share of cuts on
  a beat. A film only ships when those pass, and you can point at any moment and ask a
  model what should change, using that frame's measurements plus the shot's source.
requires_hermes: ">=0.23.0"
tags: [video, editing, media]
provides_tools:
  - video_studio
provides_hooks: []
dashboard: dashboard
config_schema:
  max_seconds:
    type: float
    default: 90.0
    label: Duration cap
    description: Hard ceiling for a rendered cut, in seconds. The gate fails a cut longer than this.
  ffmpeg:
    type: string
    default: ffmpeg
    label: ffmpeg binary
    description: Path or name of the ffmpeg executable to use.
